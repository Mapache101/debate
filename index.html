<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIS OpenClaw Debate - Mr. Olguin's Class</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Custom Scrollbar - Light Theme */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(226, 232, 240, 0.5); /* slate-200 */
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.8); /* slate-400 */
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 1); /* slate-500 */
        }

        .cursor-wait {
            cursor: wait;
        }
    </style>
</head>
<body class="bg-slate-200 text-slate-800 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons (Inlined) ---
        const IconWrapper = ({ children, color = "currentColor", size = 24, className = "" }) => (
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width={size}
                height={size}
                viewBox="0 0 24 24"
                fill="none"
                stroke={color}
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
                className={className}
            >
                {children}
            </svg>
        );

        const Terminal = (props) => <IconWrapper {...props}><polyline points="4 17 10 11 4 5" /><line x1="12" x2="20" y1="19" y2="19" /></IconWrapper>;
        const Shield = (props) => <IconWrapper {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" /></IconWrapper>;
        const Cpu = (props) => <IconWrapper {...props}><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><path d="M15 2v2" /><path d="M15 20v2" /><path d="M2 15h2" /><path d="M2 9h2" /><path d="M20 15h2" /><path d="M20 9h2" /><path d="M9 2v2" /><path d="M9 20v2" /></IconWrapper>;
        const Activity = (props) => <IconWrapper {...props}><path d="M22 12h-4l-3 9L9 3l-3 9H2" /></IconWrapper>;
        const AlertTriangle = (props) => <IconWrapper {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" x2="12" y1="9" y2="13" /><line x1="12" x2="12.01" y1="17" y2="17" /></IconWrapper>;
        const ChevronRight = (props) => <IconWrapper {...props}><path d="m9 18 6-6-6-6" /></IconWrapper>;
        const Lock = (props) => <IconWrapper {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></IconWrapper>;
        const Unlock = (props) => <IconWrapper {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 9.9-1" /></IconWrapper>;
        const Globe = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10" /><line x1="2" x2="22" y1="12" y2="12" /><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" /></IconWrapper>;
        const User = (props) => <IconWrapper {...props}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></IconWrapper>;
        const Building = (props) => <IconWrapper {...props}><rect x="4" y="2" width="16" height="20" rx="2" ry="2" /><path d="M9 22v-4h6v4" /><path d="M8 6h.01" /><path d="M16 6h.01" /><path d="M8 10h.01" /><path d="M16 10h.01" /><path d="M8 14h.01" /><path d="M16 14h.01" /><path d="M8 18h.01" /><path d="M16 18h.01" /></IconWrapper>;
        const HardDrive = (props) => <IconWrapper {...props}><line x1="22" x2="2" y1="12" y2="12" /><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" /><line x1="6" x2="6.01" y1="16" y2="16" /><line x1="10" x2="10.01" y1="16" y2="16" /></IconWrapper>;
        const X = (props) => <IconWrapper {...props}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></IconWrapper>;
        const Key = (props) => <IconWrapper {...props}><circle cx="7.5" cy="15.5" r="5.5" /><path d="m21 2-9.6 9.6" /><path d="m15.5 7.5 3 3L22 7l-3-3" /></IconWrapper>;
        const Search = (props) => <IconWrapper {...props}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></IconWrapper>;
        const MonitorIcon = (props) => <IconWrapper {...props}><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></IconWrapper>;

        // --- Utility Components ---

        const TypingText = ({ text, speed = 30, onComplete, className = "" }) => {
            const [displayedText, setDisplayedText] = useState("");
            
            useEffect(() => {
                setDisplayedText(""); 
                let i = 0;
                const interval = setInterval(() => {
                    setDisplayedText((prev) => prev + text.charAt(i));
                    i++;
                    if (i >= text.length) {
                        clearInterval(interval);
                        if (onComplete) onComplete();
                    }
                }, speed);
                return () => clearInterval(interval);
            }, [text, speed]);

            return <span className={className}>{displayedText}</span>;
        };

        const BlinkingCursor = () => (
            <span className="inline-block w-2.5 h-5 bg-current ml-1 animate-pulse align-middle"></span>
        );

        const ProgressBar = ({ label, value, colorClass = "bg-blue-600" }) => (
            <div className="mb-2 font-mono text-xs">
                <div className="flex justify-between mb-1 text-slate-600 font-bold">
                    <span>{label}</span>
                    <span>{value}%</span>
                </div>
                <div className="w-full bg-slate-200 h-2 rounded-sm overflow-hidden">
                    <div 
                        className={`h-full ${colorClass} transition-all duration-1000 ease-out`} 
                        style={{ width: `${value}%` }}
                    ></div>
                </div>
            </div>
        );

        // --- Main Views ---

        const SecurityModal = ({ targetSide, onAccessGranted, onCancel }) => {
            const [input, setInput] = useState('');
            const [error, setError] = useState(false);
            const [shake, setShake] = useState(false);

            // Added 'MODERATOR' password
            const passwords = {
                A: 'agent',
                B: 'human',
                MODERATOR: 'admin' 
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (input.toLowerCase().trim() === passwords[targetSide]) {
                    onAccessGranted();
                } else {
                    setError(true);
                    setShake(true);
                    setInput('');
                    setTimeout(() => {
                        setError(false);
                        setShake(false);
                    }, 2000);
                }
            };

            return (
                <div className="absolute inset-0 z-50 flex items-center justify-center bg-slate-100/90 backdrop-blur-sm p-4">
                    <div className={`w-full max-w-md bg-white border-2 ${error ? 'border-red-500' : 'border-slate-300'} shadow-2xl relative p-6 transition-all duration-100 ${shake ? 'translate-x-1' : ''}`}>
                        <button onClick={onCancel} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800 transition-colors">
                            <X size={20} />
                        </button>
                        
                        <div className="flex items-center gap-3 mb-6 text-slate-800">
                            <div className={`p-2 rounded bg-slate-100 ${error ? 'text-red-500' : 'text-blue-600'}`}>
                                <Lock size={24} />
                            </div>
                            <div>
                                <h3 className="font-bold text-lg font-mono tracking-wide">SECURITY CLEARANCE</h3>
                                <p className="text-xs text-slate-500 font-mono">AUTHENTICATION REQUIRED FOR PROTOCOL {targetSide}</p>
                            </div>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="space-y-2">
                                <label className="text-xs font-mono font-bold text-slate-600">ENTER PASSCODE:</label>
                                <div className="relative">
                                    <input 
                                        autoFocus
                                        type="password" 
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        className={`w-full bg-slate-50 border ${error ? 'border-red-500 text-red-600' : 'border-slate-300 text-slate-800'} font-mono p-3 pl-10 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors`}
                                        placeholder="••••••••"
                                    />
                                    <Key className="absolute left-3 top-3.5 w-4 h-4 text-slate-400" />
                                </div>
                            </div>

                            {error && (
                                <div className="text-red-600 text-xs font-mono font-bold animate-pulse flex items-center">
                                    <AlertTriangle className="w-3 h-3 mr-1" />
                                    ACCESS DENIED. INCORRECT PASSCODE.
                                </div>
                            )}

                            <div className="pt-2 flex justify-between items-center">
                                <span className="text-[10px] text-slate-400 font-mono font-bold">ATTEMPTS LOGGED</span>
                                <button 
                                    type="submit"
                                    className="bg-blue-600 hover:bg-blue-700 text-white font-mono font-bold text-xs px-4 py-2 transition-colors uppercase shadow-sm"
                                >
                                    Verify Credentials
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const LandingView = ({ onSelectSide }) => {
            const [bootSequence, setBootSequence] = useState(true);

            useEffect(() => {
                const timer = setTimeout(() => setBootSequence(false), 2000);
                return () => clearTimeout(timer);
            }, []);

            if (bootSequence) {
                return (
                    <div className="flex flex-col h-full p-8 font-mono text-emerald-600 space-y-2 bg-white">
                        <div>&gt; INITIALIZING SCIS SECURE SERVER... <span className="text-slate-800 font-bold">OK</span></div>
                        <div className="delay-100">&gt; AUTHENTICATING MR. OLGUIN'S SENIOR CLASS... <span className="text-slate-800 font-bold">OK</span></div>
                        <div className="delay-200">&gt; CONNECTING TO OPENCLAW NETWORK... <span className="text-slate-800 font-bold">ESTABLISHED</span></div>
                        <div className="delay-300">&gt; APPLYING LIGHT_THEME_PROJECTION... <span className="text-slate-800 font-bold">DONE</span></div>
                        <div className="mt-4 animate-pulse font-bold text-blue-600">&gt; SYSTEM READY_</div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-full font-mono relative overflow-hidden bg-white">
                    <div className="absolute inset-0 bg-[radial-gradient(#e2e8f0_1px,transparent_1px)] [background-size:16px_16px] opacity-50 pointer-events-none"></div>

                    <div className="z-10 flex flex-col items-center justify-center h-full p-6 space-y-6">
                        <div className="text-center space-y-4">
                            <div className="text-slate-500 font-bold tracking-widest text-sm mb-2">SCIS SENIOR DEBATE // MR. OLGUIN</div>
                            <h1 className="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-indigo-600 tracking-tighter">
                                OPENCLAW // DEBATE
                            </h1>
                            <p className="text-slate-600 font-bold text-sm md:text-base max-w-2xl mx-auto border-l-4 border-blue-500 pl-4 py-2 bg-slate-50">
                                <TypingText text="SUBJECT: THE AGE OF AUTONOMY. SELECT YOUR PROTOCOL." speed={20} />
                            </p>
                        </div>

                        {/* Research Encouragement Banner */}
                        <div className="bg-yellow-50 border border-yellow-200 text-yellow-800 px-4 py-3 rounded text-xs md:text-sm font-bold flex items-center max-w-4xl shadow-sm">
                            <Search className="w-5 h-5 mr-3 flex-shrink-0 text-yellow-600" />
                            <span>ATTENTION SCIS SENIORS: The parameters provided within are merely a baseline. You are expected by Mr. Olguin to conduct independent research, cite modern examples, and expand your arguments to secure victory.</span>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-5xl">
                            {/* Side A Card */}
                            <button 
                                onClick={() => onSelectSide('A')}
                                className="group relative border-2 border-slate-200 bg-white hover:bg-slate-50 p-8 text-left transition-all duration-300 hover:border-blue-400 hover:shadow-lg"
                            >
                                <div className="absolute top-0 left-0 w-full h-1.5 bg-blue-600 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></div>
                                <div className="flex items-center justify-between mb-6">
                                    <span className="text-4xl font-black text-slate-800 group-hover:text-blue-700 transition-colors">SIDE A</span>
                                    <Cpu className="w-10 h-10 text-blue-600 group-hover:rotate-90 transition-transform duration-500" />
                                </div>
                                <div className="flex items-center gap-2 mb-2">
                                    <h3 className="text-xl text-slate-900 font-bold tracking-wide">THE INTEGRATIONISTS</h3>
                                    <Lock className="w-4 h-4 text-slate-400 group-hover:text-blue-600 transition-colors" />
                                </div>
                                <p className="text-slate-600 font-medium text-sm mb-6">"The Steam Engine of the Mind."</p>
                                <ul className="space-y-2 text-sm text-slate-700 font-medium mb-6">
                                    <li className="flex items-center"><ChevronRight className="w-4 h-4 mr-2 text-blue-500" /> Maximize Autonomy</li>
                                    <li className="flex items-center"><ChevronRight className="w-4 h-4 mr-2 text-blue-500" /> Agentic Economy</li>
                                    <li className="flex items-center"><ChevronRight className="w-4 h-4 mr-2 text-blue-500" /> Zero Marginal Cost</li>
                                </ul>
                                <div className="inline-block px-3 py-1.5 border border-slate-300 text-slate-500 font-bold text-xs uppercase tracking-widest group-hover:bg-blue-600 group-hover:border-blue-600 group-hover:text-white transition-colors">
                                    Initialize Protocol_A [LOCKED]
                                </div>
                            </button>

                            {/* Side B Card */}
                            <button 
                                onClick={() => onSelectSide('B')}
                                className="group relative border-2 border-slate-200 bg-white hover:bg-slate-50 p-8 text-left transition-all duration-300 hover:border-orange-500 hover:shadow-lg"
                            >
                                <div className="absolute top-0 left-0 w-full h-1.5 bg-orange-500 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></div>
                                <div className="flex items-center justify-between mb-6">
                                    <span className="text-4xl font-black text-slate-800 group-hover:text-orange-600 transition-colors">SIDE B</span>
                                    <Shield className="w-10 h-10 text-orange-500 group-hover:scale-110 transition-transform duration-300" />
                                </div>
                                <div className="flex items-center gap-2 mb-2">
                                    <h3 className="text-xl text-slate-900 font-bold tracking-wide">THE PROTECTIONISTS</h3>
                                    <Lock className="w-4 h-4 text-slate-400 group-hover:text-orange-500 transition-colors" />
                                </div>
                                <p className="text-slate-600 font-medium text-sm mb-6">"Containment of Shadow AI."</p>
                                <ul className="space-y-2 text-sm text-slate-700 font-medium mb-6">
                                    <li className="flex items-center"><ChevronRight className="w-4 h-4 mr-2 text-orange-500" /> Security Sovereignty</li>
                                    <li className="flex items-center"><ChevronRight className="w-4 h-4 mr-2 text-orange-500" /> Prevent "God Mode"</li>
                                    <li className="flex items-center"><ChevronRight className="w-4 h-4 mr-2 text-orange-500" /> Human Agency</li>
                                </ul>
                                <div className="inline-block px-3 py-1.5 border border-slate-300 text-slate-500 font-bold text-xs uppercase tracking-widest group-hover:bg-orange-500 group-hover:border-orange-500 group-hover:text-white transition-colors">
                                    Initialize Protocol_B [LOCKED]
                                </div>
                            </button>
                        </div>

                        {/* Moderator Button */}
                        <button 
                            onClick={() => onSelectSide('MODERATOR')}
                            className="mt-4 flex items-center px-4 py-2 border-2 border-slate-300 bg-slate-100 text-slate-600 font-bold text-xs hover:bg-emerald-50 hover:border-emerald-500 hover:text-emerald-700 transition-all rounded"
                        >
                            <MonitorIcon className="w-4 h-4 mr-2" />
                            ACCESS MODERATOR HUB
                        </button>
                    </div>
                </div>
            );
        };

        const DetailsView = ({ side, data, onBack }) => {
            const [activeTab, setActiveTab] = useState('personal');
            const [executingAction, setExecutingAction] = useState(false);
            const [actionMessage, setActionMessage] = useState("");

            const theme = side === 'A' 
                ? { 
                    main: 'blue', 
                    bg: 'bg-blue-50', 
                    text: 'text-blue-800', 
                    border: 'border-blue-200',
                    tabActiveBorder: 'border-blue-600',
                    tabActiveText: 'text-blue-700',
                    accent: 'bg-blue-600',
                    accentText: 'text-blue-600',
                    lightBg: 'bg-white'
                } 
                : { 
                    main: 'orange', 
                    bg: 'bg-orange-50', 
                    text: 'text-orange-800', 
                    border: 'border-orange-200',
                    tabActiveBorder: 'border-orange-500',
                    tabActiveText: 'text-orange-700',
                    accent: 'bg-orange-500',
                    accentText: 'text-orange-600',
                    lightBg: 'bg-white'
                };

            const handleAction = () => {
                setExecutingAction(true);
                setActionMessage(side === 'A' ? "OPTIMIZING WORKFLOWS..." : "SECURING PERMISSIONS...");
                setTimeout(() => setActionMessage(side === 'A' ? "AGENTS DEPLOYED." : "SYSTEM LOCKDOWN ACTIVE."), 1500);
                setTimeout(() => setExecutingAction(false), 3000);
            };

            const tabs = [
                { id: 'personal', label: 'Personal', icon: User },
                { id: 'company', label: 'Company', icon: Building },
                { id: 'country', label: 'Country', icon: Globe },
                { id: 'species', label: 'Species', icon: Activity },
            ];

            return (
                <div className={`flex flex-col h-full font-mono p-4 md:p-8 bg-white`}>
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-200">
                        <div>
                            <h2 className={`text-2xl font-black ${theme.text} flex items-center tracking-tight`}>
                                {side === 'A' ? <Unlock className="mr-3 w-6 h-6" /> : <Lock className="mr-3 w-6 h-6" />}
                                PROTOCOL {side}: {data.title}
                            </h2>
                            <p className="text-slate-500 font-bold text-xs mt-1">STATUS: {side === 'A' ? 'UNRESTRICTED' : 'RESTRICTED'} // SESSION: AUTHENTICATED</p>
                        </div>
                        <button 
                            onClick={onBack}
                            className="text-slate-500 font-bold hover:text-slate-900 border-2 border-slate-200 hover:border-slate-400 bg-slate-50 px-4 py-2 text-xs transition-all"
                        >
                            &lt; TERMINATE_SESSION
                        </button>
                    </div>

                    <div className="flex flex-col md:flex-row gap-8 h-full overflow-hidden">
                        
                        {/* Sidebar */}
                        <div className={`md:w-1/3 flex flex-col gap-6 ${theme.border} border-r-2 pr-6 overflow-y-auto custom-scrollbar`}>
                            <div className={`p-5 ${theme.bg} border-2 ${theme.border} rounded-sm shadow-sm`}>
                                <h3 className={`font-black mb-3 text-sm uppercase tracking-wider ${theme.text}`}>Core Philosophy</h3>
                                <p className="text-slate-700 font-medium text-sm leading-relaxed">{data.philosophy}</p>
                            </div>

                            <div className="space-y-4">
                                <h3 className={`font-black text-sm uppercase flex items-center ${theme.text}`}>
                                    <HardDrive className="w-4 h-4 mr-2" /> Research Database
                                </h3>
                                
                                <div className="bg-slate-50 border border-slate-200 p-3 mb-2 rounded-sm text-xs font-bold text-slate-600 flex items-start">
                                    <AlertTriangle className="w-4 h-4 mr-2 flex-shrink-0 text-slate-500" />
                                    <span>SYSTEM NOTE: Expand parameters. Conduct independent queries to strengthen your protocol.</span>
                                </div>

                                <ul className="text-xs font-medium text-slate-600 space-y-3">
                                    {data.researchTerms.map((term, idx) => (
                                        <li key={idx} className="flex items-start bg-white p-2 border border-slate-100 shadow-sm hover:border-slate-300 transition-colors">
                                            <span className={`mr-2 font-bold ${theme.accentText}`}>&gt;</span> 
                                            <span className="text-slate-700">{term}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            <div className="mt-auto pt-6 pb-2">
                                <button 
                                    onClick={handleAction}
                                    disabled={executingAction}
                                    className={`w-full py-3 text-xs font-black uppercase tracking-widest transition-all shadow-md ${
                                        executingAction 
                                            ? 'bg-slate-200 text-slate-500 cursor-wait' 
                                            : `${theme.accent} text-white hover:opacity-90 active:scale-95`
                                    }`}
                                >
                                    {executingAction ? (
                                        <span className="animate-pulse">{actionMessage}</span>
                                    ) : (
                                        side === 'A' ? "EXECUTE STRATEGY_DAEMON" : "INITIATE CONTAINMENT"
                                    )}
                                </button>
                            </div>
                        </div>

                        {/* Main Content Area */}
                        <div className="md:w-2/3 flex flex-col">
                            {/* Tabs */}
                            <div className="flex border-b-2 border-slate-200 mb-6">
                                {tabs.map((tab) => {
                                    const Icon = tab.icon;
                                    const isActive = activeTab === tab.id;
                                    return (
                                        <button
                                            key={tab.id}
                                            onClick={() => setActiveTab(tab.id)}
                                            className={`flex items-center px-5 py-3 text-xs md:text-sm font-bold transition-all border-b-4 -mb-[2px] ${
                                                isActive 
                                                    ? `${theme.tabActiveBorder} ${theme.tabActiveText} bg-slate-50` 
                                                    : 'border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-50'
                                            }`}
                                        >
                                            <Icon className="w-4 h-4 mr-2" />
                                            {tab.label}
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Tab Content */}
                            <div className="flex-1 overflow-y-auto pr-4 custom-scrollbar pb-6">
                                <div className="animate-in fade-in slide-in-from-bottom-2 duration-500">
                                    <h3 className={`text-2xl font-black text-slate-900 mb-2`}>{data.points[activeTab].title}</h3>
                                    <div className={`h-1 w-16 ${theme.accent} mb-8`}></div>
                                    
                                    <div className="space-y-6">
                                        <div className="bg-white p-6 border-2 border-slate-200 shadow-sm rounded-sm">
                                            <h4 className={`text-xs font-black ${theme.accentText} mb-3 uppercase tracking-wider`}>Argument Logic</h4>
