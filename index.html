<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw // Debate Module</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(71, 85, 105, 0.8);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(94, 114, 141, 1);
        }

        .cursor-wait {
            cursor: wait;
        }
    </style>
</head>
<body class="bg-black text-slate-300 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons (Inlined to prevent CDN errors) ---
        const IconWrapper = ({ children, color = "currentColor", size = 24, className = "" }) => (
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width={size}
                height={size}
                viewBox="0 0 24 24"
                fill="none"
                stroke={color}
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
                className={className}
            >
                {children}
            </svg>
        );

        const Terminal = (props) => <IconWrapper {...props}><polyline points="4 17 10 11 4 5" /><line x1="12" x2="20" y1="19" y2="19" /></IconWrapper>;
        const Shield = (props) => <IconWrapper {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" /></IconWrapper>;
        const Cpu = (props) => <IconWrapper {...props}><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><path d="M15 2v2" /><path d="M15 20v2" /><path d="M2 15h2" /><path d="M2 9h2" /><path d="M20 15h2" /><path d="M20 9h2" /><path d="M9 2v2" /><path d="M9 20v2" /></IconWrapper>;
        const Activity = (props) => <IconWrapper {...props}><path d="M22 12h-4l-3 9L9 3l-3 9H2" /></IconWrapper>;
        const AlertTriangle = (props) => <IconWrapper {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" x2="12" y1="9" y2="13" /><line x1="12" x2="12.01" y1="17" y2="17" /></IconWrapper>;
        const ChevronRight = (props) => <IconWrapper {...props}><path d="m9 18 6-6-6-6" /></IconWrapper>;
        const Lock = (props) => <IconWrapper {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></IconWrapper>;
        const Unlock = (props) => <IconWrapper {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 9.9-1" /></IconWrapper>;
        const Globe = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10" /><line x1="2" x2="22" y1="12" y2="12" /><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" /></IconWrapper>;
        const User = (props) => <IconWrapper {...props}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></IconWrapper>;
        const Building = (props) => <IconWrapper {...props}><rect x="4" y="2" width="16" height="20" rx="2" ry="2" /><path d="M9 22v-4h6v4" /><path d="M8 6h.01" /><path d="M16 6h.01" /><path d="M8 10h.01" /><path d="M16 10h.01" /><path d="M8 14h.01" /><path d="M16 14h.01" /><path d="M8 18h.01" /><path d="M16 18h.01" /></IconWrapper>;
        const HardDrive = (props) => <IconWrapper {...props}><line x1="22" x2="2" y1="12" y2="12" /><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" /><line x1="6" x2="6.01" y1="16" y2="16" /><line x1="10" x2="10.01" y1="16" y2="16" /></IconWrapper>;
        const X = (props) => <IconWrapper {...props}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></IconWrapper>;
        const Key = (props) => <IconWrapper {...props}><circle cx="7.5" cy="15.5" r="5.5" /><path d="m21 2-9.6 9.6" /><path d="m15.5 7.5 3 3L22 7l-3-3" /></IconWrapper>;

        // --- Utility Components ---

        const TypingText = ({ text, speed = 30, onComplete, className = "" }) => {
            const [displayedText, setDisplayedText] = useState("");
            
            useEffect(() => {
                setDisplayedText(""); // Reset when text changes
                let i = 0;
                const interval = setInterval(() => {
                    setDisplayedText((prev) => prev + text.charAt(i));
                    i++;
                    if (i >= text.length) {
                        clearInterval(interval);
                        if (onComplete) onComplete();
                    }
                }, speed);
                return () => clearInterval(interval);
            }, [text, speed]);

            return <span className={className}>{displayedText}</span>;
        };

        const BlinkingCursor = () => (
            <span className="inline-block w-2.5 h-5 bg-current ml-1 animate-pulse align-middle"></span>
        );

        const ProgressBar = ({ label, value, colorClass = "bg-green-500" }) => (
            <div className="mb-2 font-mono text-xs">
                <div className="flex justify-between mb-1">
                    <span>{label}</span>
                    <span>{value}%</span>
                </div>
                <div className="w-full bg-slate-800 h-2 rounded-sm overflow-hidden">
                    <div 
                        className={`h-full ${colorClass} transition-all duration-1000 ease-out`} 
                        style={{ width: `${value}%` }}
                    ></div>
                </div>
            </div>
        );

        // --- Main Views ---

        const SecurityModal = ({ targetSide, onAccessGranted, onCancel }) => {
            const [input, setInput] = useState('');
            const [error, setError] = useState(false);
            const [shake, setShake] = useState(false);

            // Passwords configuration
            const passwords = {
                A: 'agent',
                B: 'human'
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (input.toLowerCase().trim() === passwords[targetSide]) {
                    onAccessGranted();
                } else {
                    setError(true);
                    setShake(true);
                    setInput('');
                    setTimeout(() => {
                        setError(false);
                        setShake(false);
                    }, 2000);
                }
            };

            return (
                <div className="absolute inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-sm p-4">
                    <div className={`w-full max-w-md bg-slate-900 border ${error ? 'border-red-500' : 'border-slate-600'} shadow-2xl relative p-6 transition-all duration-100 ${shake ? 'translate-x-1' : ''}`}>
                        <button onClick={onCancel} className="absolute top-4 right-4 text-slate-500 hover:text-white transition-colors">
                            <X size={20} />
                        </button>
                        
                        <div className="flex items-center gap-3 mb-6 text-slate-100">
                            <div className={`p-2 rounded bg-slate-800 ${error ? 'text-red-500' : 'text-slate-300'}`}>
                                <Lock size={24} />
                            </div>
                            <div>
                                <h3 className="font-bold text-lg font-mono tracking-wide">SECURITY CLEARANCE</h3>
                                <p className="text-xs text-slate-500 font-mono">AUTHENTICATION REQUIRED FOR PROTOCOL {targetSide}</p>
                            </div>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="space-y-2">
                                <label className="text-xs font-mono text-slate-400">ENTER PASSCODE:</label>
                                <div className="relative">
                                    <input 
                                        autoFocus
                                        type="password" 
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        className={`w-full bg-black border ${error ? 'border-red-500 text-red-500' : 'border-slate-700 text-green-400'} font-mono p-3 pl-10 focus:outline-none focus:border-white transition-colors`}
                                        placeholder="••••••••"
                                    />
                                    <Key className="absolute left-3 top-3.5 w-4 h-4 text-slate-600" />
                                </div>
                            </div>

                            {error && (
                                <div className="text-red-500 text-xs font-mono animate-pulse flex items-center">
                                    <AlertTriangle className="w-3 h-3 mr-1" />
                                    ACCESS DENIED. INCORRECT PASSCODE.
                                </div>
                            )}

                            <div className="pt-2 flex justify-between items-center">
                                <span className="text-[10px] text-slate-600 font-mono">ATTEMPTS LOGGED</span>
                                <button 
                                    type="submit"
                                    className="bg-slate-800 hover:bg-slate-700 text-white font-mono text-xs px-4 py-2 border border-slate-600 transition-colors uppercase"
                                >
                                    Verify Credentials
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // 1. Landing View
        const LandingView = ({ onSelectSide }) => {
            const [bootSequence, setBootSequence] = useState(true);

            useEffect(() => {
                const timer = setTimeout(() => setBootSequence(false), 2200);
                return () => clearTimeout(timer);
            }, []);

            if (bootSequence) {
                return (
                    <div className="flex flex-col h-full p-8 font-mono text-green-500 space-y-2">
                        <div>&gt; INITIALIZING CORE... <span className="text-white">OK</span></div>
                        <div className="delay-100">&gt; LOADING MODULES... <span className="text-white">OK</span></div>
                        <div className="delay-200">&gt; CONNECTING TO OPENCLAW NETWORK... <span className="text-white">ESTABLISHED</span></div>
                        <div className="delay-300">&gt; DECRYPTING DEBATE PARAMETERS...</div>
                        <div className="mt-4 animate-pulse">&gt; SYSTEM READY_</div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-full font-mono relative overflow-hidden">
                    {/* Background Matrix-like effect (simplified) */}
                    <div className="absolute inset-0 bg-[linear-gradient(rgba(18,22,29,0.9),rgba(18,22,29,0.9)),url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-20 pointer-events-none"></div>

                    <div className="z-10 flex flex-col items-center justify-center h-full p-6 space-y-12">
                        <div className="text-center space-y-4">
                            <h1 className="text-4xl md:text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-cyan-400 tracking-tighter">
                                OPENCLAW // DEBATE
                            </h1>
                            <p className="text-green-500/80 text-sm md:text-base max-w-2xl mx-auto border-l-2 border-green-500 pl-4 py-2 bg-green-900/10">
                                <TypingText text="SUBJECT: THE AGE OF AUTONOMY. SELECT YOUR PROTOCOL." speed={20} />
                            </p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-5xl">
                            {/* Side A Card */}
                            <button 
                                onClick={() => onSelectSide('A')}
                                className="group relative border border-cyan-500/30 bg-slate-900/50 hover:bg-cyan-900/20 p-8 text-left transition-all duration-300 hover:border-cyan-400 hover:shadow-[0_0_20px_rgba(34,211,238,0.2)]"
                            >
                                <div className="absolute top-0 left-0 w-full h-1 bg-cyan-500 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></div>
                                <div className="flex items-center justify-between mb-6">
                                    <span className="text-4xl font-bold text-cyan-400">SIDE A</span>
                                    <Cpu className="w-10 h-10 text-cyan-400 group-hover:rotate-90 transition-transform duration-500" />
                                </div>
                                <div className="flex items-center gap-2 mb-2">
                                    <h3 className="text-xl text-white font-bold tracking-wide">THE INTEGRATIONISTS</h3>
                                    <Lock className="w-3 h-3 text-slate-500 group-hover:text-cyan-400 transition-colors" />
                                </div>
                                <p className="text-cyan-200/60 text-sm mb-6">"The Steam Engine of the Mind."</p>
                                <ul className="space-y-2 text-sm text-cyan-100/80 mb-6">
                                    <li className="flex items-center"><ChevronRight className="w-3 h-3 mr-2" /> Maximize Autonomy</li>
                                    <li className="flex items-center"><ChevronRight className="w-3 h-3 mr-2" /> Agentic Economy</li>
                                    <li className="flex items-center"><ChevronRight className="w-3 h-3 mr-2" /> Zero Marginal Cost</li>
                                </ul>
                                <div className="inline-block px-3 py-1 border border-cyan-500/50 text-cyan-400 text-xs uppercase tracking-widest group-hover:bg-cyan-500 group-hover:text-black transition-colors">
                                    Initialize Protocol_A [LOCKED]
                                </div>
                            </button>

                            {/* Side B Card */}
                            <button 
                                onClick={() => onSelectSide('B')}
                                className="group relative border border-amber-500/30 bg-slate-900/50 hover:bg-amber-900/20 p-8 text-left transition-all duration-300 hover:border-amber-400 hover:shadow-[0_0_20px_rgba(251,191,36,0.2)]"
                            >
                                <div className="absolute top-0 left-0 w-full h-1 bg-amber-500 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></div>
                                <div className="flex items-center justify-between mb-6">
                                    <span className="text-4xl font-bold text-amber-500">SIDE B</span>
                                    <Shield className="w-10 h-10 text-amber-500 group-hover:scale-110 transition-transform duration-300" />
                                </div>
                                <div className="flex items-center gap-2 mb-2">
                                    <h3 className="text-xl text-white font-bold tracking-wide">THE PROTECTIONISTS</h3>
                                    <Lock className="w-3 h-3 text-slate-500 group-hover:text-amber-400 transition-colors" />
                                </div>
                                <p className="text-amber-200/60 text-sm mb-6">"Containment of Shadow AI."</p>
                                <ul className="space-y-2 text-sm text-amber-100/80 mb-6">
                                    <li className="flex items-center"><ChevronRight className="w-3 h-3 mr-2" /> Security Sovereignty</li>
                                    <li className="flex items-center"><ChevronRight className="w-3 h-3 mr-2" /> Prevent "God Mode"</li>
                                    <li className="flex items-center"><ChevronRight className="w-3 h-3 mr-2" /> Human Agency</li>
                                </ul>
                                <div className="inline-block px-3 py-1 border border-amber-500/50 text-amber-400 text-xs uppercase tracking-widest group-hover:bg-amber-500 group-hover:text-black transition-colors">
                                    Initialize Protocol_B [LOCKED]
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. Details View (Reusable for both sides)
        const DetailsView = ({ side, data, onBack }) => {
            const [activeTab, setActiveTab] = useState('personal');
            const [executingAction, setExecutingAction] = useState(false);
            const [actionMessage, setActionMessage] = useState("");

            const theme = side === 'A' 
                ? { 
                    main: 'cyan', 
                    bg: 'bg-cyan-950', 
                    text: 'text-cyan-400', 
                    border: 'border-cyan-500/30',
                    hover: 'hover:bg-cyan-500/10',
                    accent: 'bg-cyan-500'
                } 
                : { 
                    main: 'amber', 
                    bg: 'bg-amber-950', 
                    text: 'text-amber-500', 
                    border: 'border-amber-500/30',
                    hover: 'hover:bg-amber-500/10',
                    accent: 'bg-amber-500'
                };

            const handleAction = () => {
                setExecutingAction(true);
                setActionMessage(side === 'A' ? "OPTIMIZING WORKFLOWS..." : "SECURING PERMISSIONS...");
                setTimeout(() => setActionMessage(side === 'A' ? "AGENTS DEPLOYED." : "SYSTEM LOCKDOWN ACTIVE."), 1500);
                setTimeout(() => setExecutingAction(false), 3000);
            };

            const tabs = [
                { id: 'personal', label: 'Personal', icon: User },
                { id: 'company', label: 'Company', icon: Building },
                { id: 'country', label: 'Country', icon: Globe },
                { id: 'species', label: 'Species', icon: Activity },
            ];

            return (
                <div className={`flex flex-col h-full font-mono p-4 md:p-8 ${side === 'A' ? 'bg-slate-900/50' : 'bg-slate-900/50'}`}>
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-700">
                        <div>
                            <h2 className={`text-2xl font-bold ${theme.text} flex items-center`}>
                                {side === 'A' ? <Unlock className="mr-3 w-6 h-6" /> : <Lock className="mr-3 w-6 h-6" />}
                                PROTOCOL {side}: {data.title}
                            </h2>
                            <p className="text-slate-400 text-xs mt-1">STATUS: {side === 'A' ? 'UNRESTRICTED' : 'RESTRICTED'} // SESSION: AUTHENTICATED</p>
                        </div>
                        <button 
                            onClick={onBack}
                            className="text-slate-500 hover:text-white border border-slate-700 hover:border-white px-4 py-2 text-xs transition-all"
                        >
                            &lt; TERMINATE_SESSION
                        </button>
                    </div>

                    <div className="flex flex-col md:flex-row gap-6 h-full overflow-hidden">
                        
                        {/* Sidebar / Core Philosophy */}
                        <div className={`md:w-1/3 flex flex-col gap-6 ${theme.border} border-r pr-6 overflow-y-auto`}>
                            <div className={`p-4 ${theme.bg} border ${theme.border} rounded-sm`}>
                                <h3 className="text-white font-bold mb-2 text-sm uppercase">Core Philosophy</h3>
                                <p className="text-slate-300 text-sm leading-relaxed">{data.philosophy}</p>
                            </div>

                            <div className="space-y-4">
                                <h3 className="text-white font-bold text-sm uppercase flex items-center">
                                    <HardDrive className="w-4 h-4 mr-2" /> Research Database
                                </h3>
                                <ul className="text-xs text-slate-400 space-y-2">
                                    {data.researchTerms.map((term, idx) => (
                                        <li key={idx} className="flex items-start">
                                            <span className={`mr-2 ${theme.text}`}>&gt;</span> 
                                            <span className="hover:text-white cursor-pointer transition-colors">"{term}"</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            <div className="mt-auto pt-6">
                                <button 
                                    onClick={handleAction}
                                    disabled={executingAction}
                                    className={`w-full py-3 text-xs font-bold uppercase tracking-widest transition-all ${
                                        executingAction 
                                            ? 'bg-slate-800 text-slate-500 cursor-wait' 
                                            : `${theme.accent} text-black hover:opacity-90 active:scale-95`
                                    }`}
                                >
                                    {executingAction ? (
                                        <span className="animate-pulse">{actionMessage}</span>
                                    ) : (
                                        side === 'A' ? "EXECUTE STRATEGY_DAEMON" : "INITIATE CONTAINMENT"
                                    )}
                                </button>
                            </div>
                        </div>

                        {/* Main Content Area */}
                        <div className="md:w-2/3 flex flex-col">
                            {/* Tabs */}
                            <div className="flex border-b border-slate-700 mb-6">
                                {tabs.map((tab) => {
                                    const Icon = tab.icon;
                                    const isActive = activeTab === tab.id;
                                    return (
                                        <button
                                            key={tab.id}
                                            onClick={() => setActiveTab(tab.id)}
                                            className={`flex items-center px-4 py-2 text-xs md:text-sm transition-colors border-b-2 ${
                                                isActive 
                                                    ? `border-${theme.main}-500 text-white bg-slate-800` 
                                                    : 'border-transparent text-slate-500 hover:text-slate-300 hover:bg-slate-800/50'
                                            }`}
                                        >
                                            <Icon className="w-3 h-3 mr-2" />
                                            {tab.label}
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Tab Content */}
                            <div className="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                                <div className="animate-in fade-in slide-in-from-bottom-2 duration-500">
                                    <h3 className={`text-xl font-bold text-white mb-2`}>{data.points[activeTab].title}</h3>
                                    <div className={`h-0.5 w-12 ${theme.accent} mb-6`}></div>
                                    
                                    <div className="space-y-6">
                                        <div className="bg-slate-900/40 p-5 border border-slate-700 rounded-sm">
                                            <h4 className={`text-xs font-bold ${theme.text} mb-2 uppercase`}>Argument Logic</h4>
                                            <p className="text-slate-300 leading-relaxed text-sm">
                                                {data.points[activeTab].argument}
                                            </p>
                                        </div>

                                        <div className="bg-slate-900/40 p-5 border border-slate-700 rounded-sm">
                                            <h4 className={`text-xs font-bold ${theme.text} mb-2 uppercase`}>Key Concept</h4>
                                            <div className="flex items-start">
                                                <div className={`mt-1 w-2 h-2 ${theme.accent} rounded-full mr-3 animate-pulse`}></div>
                                                <div>
                                                    <strong className="text-white block mb-1">{data.points[activeTab].conceptTitle}</strong>
                                                    <p className="text-slate-400 text-sm">{data.points[activeTab].conceptDesc}</p>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Decorative Stats */}
                                        <div className="grid grid-cols-2 gap-4 mt-8 pt-6 border-t border-slate-800">
                                            <ProgressBar label="IMPACT PROBABILITY" value={side === 'A' ? 89 : 74} colorClass={theme.accent} />
                                            <ProgressBar label="SYSTEM LOAD" value={side === 'A' ? 42 : 91} colorClass={side === 'A' ? 'bg-green-500' : 'bg-red-500'} />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };


        // --- Data Definitions ---

        const dataSideA = {
            title: "INTEGRATION",
            philosophy: "AI Agents like OpenClaw are the \"Steam Engine of the Mind.\" They liberate humans from drudgery, create an \"Agentic Economy,\" and solve problems too complex for unassisted human intellect.",
            researchTerms: [
                "OpenClaw productivity stats 2026",
                "Zero marginal cost of cognitive labor",
                "Agentic Economy definition",
                "AI closing skills gap"
            ],
            points: {
                personal: {
                    title: "The Super-Empowered Individual",
                    argument: "Agents act as a 'second brain' and 'extra hands.' They handle the 'noise' of life (scheduling, emails, bureaucracy), allowing humans to focus on 'deep work,' creativity, and leisure.",
                    conceptTitle: "Cognitive Offloading",
                    conceptDesc: "We aren't becoming dumber; we are clearing mental RAM for higher-level thinking."
                },
                company: {
                    title: "The Agentic Economy",
                    argument: "We are moving from 'Co-pilots' (human drives, AI assists) to 'Auto-pilots' (AI drives, human monitors). Small teams can now rival massive corporations in output.",
                    conceptTitle: "Zero Marginal Cost of Labor",
                    conceptDesc: "Once an agent is trained to do a task, doing it 1,000 times costs the same as doing it once."
                },
                country: {
                    title: "National Competitiveness",
                    argument: "Countries that ban or restrict autonomous agents will suffer a 'productivity collapse' compared to those that integrate them. It is an arms race for economic efficiency.",
                    conceptTitle: "The Skills Gap Solution",
                    conceptDesc: "Agents can instantly fill national shortages in coding, administration, and healthcare logistics."
                },
                species: {
                    title: "Solving the Unsolvable",
                    argument: "Human cognition has limits. To solve climate change, protein folding, or interstellar travel, we need intelligence that can act and iterate faster than biological neurons allow.",
                    conceptTitle: "Evolutionary Acceleration",
                    conceptDesc: "Transcending biological limitations through synthetic cooperation."
                }
            }
        };

        const dataSideB = {
            title: "CONTAINMENT",
            philosophy: "Autonomous Agents represent an unacceptable security risk ('Shadow AI') and a fundamental threat to human agency. Granting 'God Mode' permissions to software creates a fragility we cannot reverse.",
            researchTerms: [
                "OpenClaw prompt injection attacks 2026",
                "Shadow AI security risks",
                "Human skill atrophy",
                "Algorithmic Fragility in banking"
            ],
            points: {
                personal: {
                    title: "Loss of Agency & Privacy",
                    argument: "OpenClaw runs locally and reads everything. If compromised, it is the ultimate spy. Furthermore, if an agent does everything for you, you lose the ability to do it yourself.",
                    conceptTitle: "The 'Wall-E' Effect",
                    conceptDesc: "Humans becoming helpless dependents on their digital servants, leading to severe skill atrophy."
                },
                company: {
                    title: "Shadow AI & Security Nightmares",
                    argument: "Employees are installing OpenClaw to 'work faster', bypassing security. This gives the agent—and hackers—unfettered access to trade secrets and internal networks.",
                    conceptTitle: "The Blast Radius",
                    conceptDesc: "One compromised agent doesn't just leak one file; it destroys databases and authorizes fraudulent payments."
                },
                country: {
                    title: "Infrastructure Vulnerability",
                    argument: "If our power grids and banking systems rely on autonomous agents, we create a single point of failure. A 'prompt injection' attack could cause cascading physical damage.",
                    conceptTitle: "Algorithmic Fragility",
                    conceptDesc: "Systems that run too fast for humans to intervene when they go wrong."
                },
                species: {
                    title: "The Alignment Problem",
                    argument: "Agents optimize for goals, not values. If you tell an agent to 'maximize profit,' it might commit fraud or destroy competitors in ways you didn't intend.",
                    conceptTitle: "Value Misalignment",
                    conceptDesc: "Powerful optimization processes that accidentally destroy what we care about."
                }
            }
        };


        // --- App Container ---

        function App() {
            const [currentView, setCurrentView] = useState('landing'); // landing, sideA, sideB
            const [authTarget, setAuthTarget] = useState(null); // 'A' or 'B'

            const handleSideSelection = (side) => {
                setAuthTarget(side);
            };

            const handleAuthSuccess = () => {
                setCurrentView(`side${authTarget}`);
                setAuthTarget(null);
            };

            return (
                <div className="w-full h-screen flex items-center justify-center p-2 md:p-6">
                    
                    {/* Terminal Window Wrapper */}
                    <div className="w-full max-w-6xl h-full md:h-[90vh] bg-slate-950 border border-slate-700 rounded-lg shadow-2xl flex flex-col overflow-hidden relative">
                        
                        {/* Title Bar */}
                        <div className="bg-slate-900 border-b border-slate-800 p-2 flex items-center justify-between select-none">
                            <div className="flex space-x-2 ml-2">
                                <div className="w-3 h-3 rounded-full bg-red-500/80 hover:bg-red-500"></div>
                                <div className="w-3 h-3 rounded-full bg-amber-500/80 hover:bg-amber-500"></div>
                                <div className="w-3 h-3 rounded-full bg-green-500/80 hover:bg-green-500"></div>
                            </div>
                            <div className="text-xs font-mono text-slate-500 flex items-center">
                                <Terminal className="w-3 h-3 mr-2" />
                                user@openclaw:~/debate_module_v2.026
                            </div>
                            <div className="mr-2">
                                <Activity className="w-4 h-4 text-slate-600" />
                            </div>
                        </div>

                        {/* Status Bar / Menu */}
                        <div className="bg-slate-950 border-b border-slate-800 p-1 px-4 flex text-xs font-mono text-slate-500 space-x-4">
                            <span className="hover:text-green-400 cursor-pointer transition-colors">FILE</span>
                            <span className="hover:text-green-400 cursor-pointer transition-colors">EDIT</span>
                            <span className="hover:text-green-400 cursor-pointer transition-colors">VIEW</span>
                            <span className="hover:text-green-400 cursor-pointer transition-colors">HELP</span>
                            <span className="flex-grow"></span>
                            <span className="text-green-500/50">CONN: SECURE_SOCKET_LAYER</span>
                        </div>

                        {/* Content Area */}
                        <div className="flex-grow overflow-hidden relative">
                            
                            {currentView === 'landing' && (
                                <React.Fragment>
                                    <LandingView onSelectSide={handleSideSelection} />
                                    {authTarget && (
                                        <SecurityModal 
                                            targetSide={authTarget} 
                                            onAccessGranted={handleAuthSuccess} 
                                            onCancel={() => setAuthTarget(null)} 
                                        />
                                    )}
                                </React.Fragment>
                            )}

                            {currentView === 'sideA' && (
                                <DetailsView side="A" data={dataSideA} onBack={() => setCurrentView('landing')} />
                            )}

                            {currentView === 'sideB' && (
                                <DetailsView side="B" data={dataSideB} onBack={() => setCurrentView('landing')} />
                            )}
                        
                        </div>

                        {/* Bottom Command Line */}
                        <div className="bg-slate-900 border-t border-slate-800 p-2 px-4 text-xs font-mono text-slate-400 flex items-center">
                            <span className="text-green-500 mr-2">➜</span>
                            <span className="mr-2">~</span>
                            {currentView === 'landing' && !authTarget && <span className="text-slate-500">awaiting_input...</span>}
                            {currentView === 'landing' && authTarget && <span className="text-yellow-500 animate-pulse">authentication_required</span>}
                            {currentView === 'sideA' && <span className="text-cyan-500">running_protocol_integration.exe</span>}
                            {currentView === 'sideB' && <span className="text-amber-500">running_protocol_containment.sh</span>}
                            <BlinkingCursor />
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
